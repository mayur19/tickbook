name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      # The runner's preinstalled PostgreSQL (no containers).
      TEST_DATABASE_URL: postgres://tickbook:tickbook@localhost:5432/tickbook_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -p 5432; do sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE tickbook LOGIN PASSWORD 'tickbook' CREATEDB;"
          sudo -u postgres createdb -O tickbook tickbook_test
          psql "$TEST_DATABASE_URL" -c 'SELECT version();'

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build
