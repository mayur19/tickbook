    get:
      tags: [Accounts]
      operationId: getPnl
      summary: Realised and unrealised P&L
      x-status: pending
      x-ticket: TB-303
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/accounts/{id}/deposits:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Accounts]
      operationId: createDeposit
      summary: Simulated cash funding
      x-status: pending
      x-ticket: TB-305
