        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/fee-schedules:
    get:
      tags: [Fees and risk]
      operationId: listFeeSchedules
      summary: Maker/taker fee schedules
      x-status: pending
      x-ticket: TB-310
      responses:
        '501':
