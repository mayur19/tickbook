      x-status: pending
      x-ticket: TB-310
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/admin/instruments:
    post:
      tags: [Venue admin]
      operationId: createInstrument
      summary: List a new instrument
      x-status: pending
      x-ticket: TB-501
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/admin/instruments/{symbol}:
