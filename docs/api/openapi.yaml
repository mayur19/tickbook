        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/audit-logs:
    get:
      tags: [Members]
      operationId: searchAuditLogs
      summary: Search the audit log
      x-status: pending
      x-ticket: TB-805
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/api-keys:
    post:
      tags: [Members]
      operationId: createApiKey
      summary: Issue an API key for a strategy client
      x-status: pending
      x-ticket: TB-810
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tb_session
      description: HttpOnly, SameSite=Lax session cookie set by login. Stored server-side as an HMAC hash.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must equal the session's CSRF token (from `tb_csrf` cookie, login response or /auth/me).
      schema:
        type: string
    Symbol:
      name: symbol
      in: path
      required: true
      description: Instrument symbol (case-insensitive), e.g. TBK.
      schema:
        type: string
        pattern: '^[A-Za-z0-9.]{1,12}$'
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: '`VALIDATION_FAILED` (details.issues[] with path and message) or `INVALID_JSON`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: '`UNAUTHENTICATED`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: '`FORBIDDEN` (role lacks the permission).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CsrfFailed:
      description: '`CSRF_FAILED`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: '`NOT_FOUND`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: '`RATE_LIMITED`; `Retry-After` header and details.retryAfterSeconds.'
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotImplemented:
      description: Pending feature. `error.code = NOT_IMPLEMENTED`, `error.details.ticket` names the backlog ticket.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: NOT_IMPLEMENTED
              message: OHLCV candles is not implemented yet
              details:
                ticket: TB-401
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - VALIDATION_FAILED
            - INVALID_JSON
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - FORBIDDEN
            - CSRF_FAILED
            - NOT_FOUND
            - ORDER_NOT_OPEN
            - DUPLICATE_CLIENT_ORDER_ID
            - SETTLEMENT_CONFLICT
            - INSTRUMENT_NOT_OPEN
            - PRICE_REQUIRED
            - RISK_REJECTED
            - ORDER_REJECTED
            - RATE_LIMITED
            - NOT_IMPLEMENTED
            - NOT_READY
            - ENGINE_INCONSISTENT
            - INTERNAL
        message:
          type: string
        details: {}
    ErrorEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ApiError'
    MessageEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
        error:
          type: 'null'
    HealthEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              const: ok
            uptimeSeconds:
              type: integer
        error:
          type: 'null'
    ReadyEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              const: ready
            instruments:
              type: integer
        error:
          type: 'null'
    RegisterRequest:
      type: object
      required: [organizationName, displayName, email, password]
      properties:
        organizationName:
          type: string
          minLength: 2
          maxLength: 120
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
    LoginEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            userId:
              type: string
              format: uuid
            organizationId:
              type: string
              format: uuid
            csrfToken:
              type: string
        error:
          type: 'null'
    MeEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                displayName:
                  type: string
            organization:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
            role:
              type: string
              enum: [owner, trader, viewer]
            permissions:
              type: array
              items:
                type: string
                enum:
                  [
                    orders:place,
                    orders:cancel,
                    orders:read,
                    accounts:read,
                    marketdata:read,
                    members:manage,
                    audit:read,
                  ]
            csrfToken:
              type: string
        error:
          type: 'null'
    Instrument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        symbol:
          type: string
        name:
          type: string
        currency:
          type: string
          example: USD
        tickSize:
          type: integer
          description: Minimum price increment, minor units.
        lotSize:
          type: integer
        maxOrderQty:
          type: integer
        referencePrice:
          type: integer
        priceBandBps:
          type: integer
          description: Fat-finger band around the last/reference price, basis points.
        status:
          type: string
          enum: [open, halted, closed]
        lastPrice:
          type: [integer, 'null']
        quote:
          type: object
          properties:
            bid:
              type: [integer, 'null']
            ask:
              type: [integer, 'null']
    DepthLevel:
      type: object
      required: [price, quantity, orders]
      properties:
        price:
          type: integer
        quantity:
          type: integer
        orders:
          type: integer
    BookSnapshot:
      type: object
      properties:
        symbol:
          type: string
        seq:
          type: integer
          description: Engine sequence of the last applied command.
        bids:
          type: array
          items:
            $ref: '#/components/schemas/DepthLevel'
        asks:
          type: array
          items:
            $ref: '#/components/schemas/DepthLevel'
    PublicTrade:
      type: object
      properties:
        tradeId:
          type: integer
        price:
          type: integer
        quantity:
          type: integer
        aggressorSide:
          type: string
          enum: [buy, sell]
        executedAt:
          type: string
          format: date-time
    Candle:
      type: object
      properties:
        start:
          type: string
          format: date-time
        open:
          type: integer
        high:
          type: integer
        low:
          type: integer
        close:
          type: integer
        volume:
          type: integer
    PlaceOrderRequest:
      type: object
      required: [accountId, symbol, side, type, quantity]
      properties:
        accountId:
          type: string
          format: uuid
        symbol:
          type: string
          pattern: '^[A-Za-z0-9.]{1,12}$'
        side:
          type: string
          enum: [buy, sell]
        type:
          type: string
          enum: [limit, market, stop, stop_limit]
          description: '`stop` and `stop_limit` are pending (501, TB-201).'
        timeInForce:
          type: string
          enum: [GTC, IOC, FOK, DAY, GTD]
          default: GTC
          description: 'Market orders require IOC or FOK. `DAY`/`GTD` are pending (501, TB-204).'
        price:
          type: integer
          minimum: 1
          description: Limit price in minor units; required for limit orders, forbidden for market.
        stopPrice:
          type: integer
          minimum: 1
          description: Pending (TB-201).
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000000
        displayQuantity:
          type: integer
          minimum: 1
          description: Iceberg visible quantity; pending (501, TB-202).
        postOnly:
          type: boolean
          description: Pending (501, TB-203).
        clientOrderId:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique per account.
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientOrderId:
          type: [string, 'null']
        accountId:
          type: string
          format: uuid
        symbol:
          type: string
        side:
          type: string
          enum: [buy, sell]
        type:
          type: string
          enum: [limit, market]
        timeInForce:
          type: string
          enum: [GTC, IOC, FOK]
        price:
          type: [integer, 'null']
        quantity:
          type: integer
        filledQuantity:
          type: integer
        filledNotional:
          type: integer
          description: Sum of price x quantity over fills (minor units); average = filledNotional / filledQuantity.
        remainingQuantity:
          type: integer
        status:
          type: string
          enum: [new, partially_filled, filled, cancelled, rejected]
        rejectReason:
          type: [string, 'null']
          description: Engine reason (e.g. price_not_tick_multiple) or `risk:<violation>`.
        cancelReason:
          type: [string, 'null']
          enum:
            [
              ioc_remainder,
              fok_unfillable,
              market_no_liquidity,
              user_requested,
              insufficient_funds,
              null,
            ]
          description: '`insufficient_funds` = resting order cancelled by the venue because its account can no longer settle it (cash or position changed out of band); journaled as an engine cancel.'
        journalSeq:
          type: [integer, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Execution:
      type: object
      description: Execution as seen by the order owner. Counterparty identities are never disclosed.
      properties:
        tradeId:
          type: integer
        price:
          type: integer
        quantity:
          type: integer
        liquidity:
          type: string
          const: taker
    PlaceOrderEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            order:
              $ref: '#/components/schemas/Order'
            trades:
              type: array
              items:
                $ref: '#/components/schemas/Execution'
        error:
          type: 'null'
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
        cashMinor:
          type: integer
        maxOrderNotional:
          type: integer
        maxPosition:
          type: integer
        reservedCashMinor:
          type: integer
          description: Durable column `accounts.reserved_cash_minor` = sum of price x remaining of the account's resting buys across all instruments.
        availableCashMinor:
          type: integer
        positions:
          type: array
          items:
            type: object
            properties:
              symbol:
                type: string
              quantity:
                type: integer
    WsSnapshot:
      type: object
      required: [type, symbol, seq, bids, asks]
      properties:
        type:
          const: snapshot
        symbol:
          type: string
        seq:
          type: integer
        bids:
          type: array
          items:
            $ref: '#/components/schemas/DepthLevel'
        asks:
          type: array
          items:
            $ref: '#/components/schemas/DepthLevel'
    WsDepth:
      type: object
      required: [type, symbol, seq, updates]
      properties:
        type:
          const: depth
        symbol:
          type: string
        seq:
          type: integer
        updates:
          type: array
          items:
            type: object
            properties:
              side:
                type: string
                enum: [buy, sell]
              price:
                type: integer
              quantity:
                type: integer
                description: 0 removes the level.
              orders:
                type: integer
    WsTrade:
      type: object
      required: [type, symbol, seq, tradeId, price, quantity, aggressorSide, ts]
      properties:
        type:
          const: trade
        symbol:
          type: string
        seq:
          type: integer
        tradeId:
          type: integer
        price:
          type: integer
        quantity:
          type: integer
        aggressorSide:
          type: string
          enum: [buy, sell]
        ts:
          type: string
          format: date-time
