openapi: 3.1.0
info:
  title: Tickbook API
  version: 0.1.0
  summary: Simulated exchange order-matching engine and paper-trading venue.
  description: |
    Tickbook is a **simulated venue for education and strategy testing**. No real money moves,
    no external market data is consumed, and nothing here is a real trading service.

    Conventions:
    - Every JSON response uses the envelope `{ data, error, meta? }`.
    - Prices and cash are **integer minor units** (cents). Quantities are integer instrument units.
    - Authentication is a session cookie (`tb_session`, HttpOnly, SameSite=Lax). Mutating requests
      made with a session must echo the CSRF token in `X-CSRF-Token`.
    - Each operation carries `x-status: implemented` or `x-status: pending`. Pending operations are
      routed and answer `501 NOT_IMPLEMENTED` with their backlog ticket in `error.details.ticket`.

    ### Market-data WebSocket (implemented)
    `GET /ws/market?symbol=TBK` upgrades to a WebSocket (session cookie required). See
    `x-websocket` at the document root for the message contract.
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:4106
    description: Local development API
x-websocket:
  path: /ws/market
  x-status: implemented
  query:
    symbol: Instrument symbol (case-insensitive).
  auth: Session cookie; role needs `marketdata:read`.
  flow: |
    1. On connect the server sends one `snapshot` (best 20 levels per side, `DEPTH_PUBLISH_LEVELS`).
    2. It then pushes `depth` (incremental level changes, quantity 0 = level removed) and `trade`
       messages, each tagged with the engine sequence number `seq` of the command that caused it.
    3. The client may send the text frame `snapshot` at any time to receive a fresh snapshot.
    Messages with `seq` lower than the last snapshot must be ignored.
  serverMessages:
    snapshot: '#/components/schemas/WsSnapshot'
    depth: '#/components/schemas/WsDepth'
    trade: '#/components/schemas/WsTrade'
  closeCodes:
    '4401': Not authenticated or missing marketdata:read permission.
    '4404': Unknown symbol.
    '1013': Consumer too slow (more than 1 MB buffered); reconnect and resnapshot.
tags:
  - name: Platform
  - name: Auth
  - name: Instruments
  - name: Market data
  - name: Orders
  - name: Accounts
  - name: Fees and risk
  - name: Venue admin
  - name: Surveillance
  - name: Reports
  - name: Members
security:
  - sessionCookie: []
paths:
  /health:
    get:
      tags: [Platform]
      operationId: getHealth
      summary: Liveness probe
      security: []
      x-status: implemented
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
  /ready:
    get:
      tags: [Platform]
      operationId: getReady
      summary: Readiness probe (database reachable, books recovered)
      security: []
      x-status: implemented
      responses:
        '200':
          description: Ready to serve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyEnvelope'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a participant firm with its owner and a funded paper account
      description: |
        Always answers `202` with the same generic body, whether or not the email is already
        registered, so the endpoint cannot be used to enumerate accounts. No session is issued;
        the user signs in afterwards. Rate-limited per normalised client IP
        (`REGISTER_RATE_LIMIT_PER_HOUR`). Email verification through the local outbox is planned (TB-812).
      security: []
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Accepted (generic).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in and receive session + CSRF cookies
      description: |
        Throttled per email (progressive backoff after 5 failures), per normalised IP
        (`LOGIN_RATE_LIMIT_PER_MINUTE`) and by distinct emails per IP per minute.
        Sets `tb_session` (HttpOnly) and `tb_csrf` (readable) cookies.
      security: []
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: '`tb_session` and `tb_csrf` cookies.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: '`INVALID_CREDENTIALS` (generic for unknown email or wrong password).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session deleted and cookies cleared.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfFailed'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user, organization, role, permissions and CSRF token
      x-status: implemented
      responses:
        '200':
          description: Session details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm signup via a link delivered to the local outbox
      security: []
      x-status: pending
      x-ticket: TB-812
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/instruments:
    get:
      tags: [Instruments]
      operationId: listInstruments
      summary: List instruments with last price and top-of-book quote
      x-status: implemented
      responses:
        '200':
          description: Instruments ordered by symbol.
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Instrument'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/instruments/{symbol}:
    parameters:
      - $ref: '#/components/parameters/Symbol'
    get:
      tags: [Instruments]
      operationId: getInstrument
      summary: Instrument rules, last price and quote
      x-status: implemented
      responses:
        '200':
          description: Instrument.
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    $ref: '#/components/schemas/Instrument'
                  error:
                    type: 'null'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/instruments/{symbol}/book:
    parameters:
      - $ref: '#/components/parameters/Symbol'
    get:
      tags: [Market data]
      operationId: getBook
      summary: Level-2 depth snapshot
      x-status: implemented
      parameters:
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Aggregated price levels (no order identities).
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    $ref: '#/components/schemas/BookSnapshot'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/instruments/{symbol}/trades:
    parameters:
      - $ref: '#/components/parameters/Symbol'
    get:
      tags: [Market data]
      operationId: listTrades
      summary: Recent trades (newest first, anonymous)
      x-status: implemented
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: Trades tape.
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicTrade'
                  error:
                    type: 'null'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/instruments/{symbol}/candles:
    parameters:
      - $ref: '#/components/parameters/Symbol'
    get:
      tags: [Market data]
      operationId: listCandles
      summary: OHLCV candles aggregated from the trade tape
      x-status: pending
      x-ticket: TB-401
      parameters:
        - name: interval
          in: query
          schema:
            type: string
            enum: [1s, 1m, 5m, 15m, 1h, 1d]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Candles (planned shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Candle'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/instruments/{symbol}/quote:
    parameters:
      - $ref: '#/components/parameters/Symbol'
    get:
      tags: [Market data]
      operationId: getQuote
      summary: Level-1 quote with session statistics
      x-status: pending
      x-ticket: TB-402
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/instruments/{symbol}/auction:
    parameters:
      - $ref: '#/components/parameters/Symbol'
    get:
      tags: [Market data]
      operationId: getIndicativeAuction
      summary: Indicative uncrossing price and volume during a call phase
      x-status: pending
      x-ticket: TB-521
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/orders:
    post:
      tags: [Orders]
      operationId: placeOrder
      summary: Place an order (risk-checked, matched and journaled atomically)
      description: |
        Executable today: `limit` (GTC, IOC, FOK) and `market` (IOC, FOK). Requests using
        `stop`/`stop_limit` (TB-201), `displayQuantity` (iceberg, TB-202), `postOnly` (TB-203) or
        `DAY`/`GTD` (TB-204) answer `501`. Pre-trade risk runs inside the instrument's serialized
        section. Engine-rejected orders (tick/lot rules) consume a journal sequence number;
        risk-rejected orders are persisted but not journaled.
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Accepted by the engine; includes the executions this command produced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceOrderEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown instrument or account not owned by the caller's firm (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`INSTRUMENT_NOT_OPEN`, `DUPLICATE_CLIENT_ORDER_ID` or `SETTLEMENT_CONFLICT` (concurrent settlement conflict such as a database deadlock; nothing was applied, safe to retry).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            `PRICE_REQUIRED`, `RISK_REJECTED` (details: orderId, violations[]) or
            `ORDER_REJECTED` (details: orderId, reason).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '501':
          $ref: '#/components/responses/NotImplemented'
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List the firm's orders, newest first
      x-status: implemented
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed, all]
            default: all
        - name: symbol
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Orders with `meta.count` and `meta.limit`.
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  error:
                    type: 'null'
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                      limit:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/orders/mass-cancel:
    post:
      tags: [Orders]
      operationId: massCancel
      summary: Cancel all open orders by account or symbol
      x-status: pending
      x-ticket: TB-211
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get one of the firm's orders
      x-status: implemented
      responses:
        '200':
          description: Order.
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel a resting order (journaled)
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Cancelled order (`status=cancelled`, `cancelReason=user_requested`).
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
                  error:
                    type: 'null'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ORDER_NOT_OPEN` (already filled, cancelled or rejected).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/orders/{id}/replace:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      operationId: replaceOrder
      summary: Cancel/replace (amend) price or quantity
      x-status: pending
      x-ticket: TB-210
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/orders/{id}/fills:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      operationId: listOrderFills
      summary: Execution reports for an order
      x-status: pending
      x-ticket: TB-212
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: Firm accounts with cash, reserved cash and positions
      x-status: implemented
      responses:
        '200':
          description: Accounts.
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Open an additional trading account
      x-status: pending
      x-ticket: TB-307
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/accounts/{id}/ledger:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getLedger
      summary: Double-entry settlement ledger postings
      x-status: pending
      x-ticket: TB-301
